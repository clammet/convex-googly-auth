name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version or publish package
    if: vars.NPM_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Node setup
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org/"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Identify dependency-only release
        id: dependency-release
        shell: bash
        run: |
          shopt -s nullglob
          changesets=(.changeset/*.md)
          found=false
          dependency_only=true
          for changeset in "${changesets[@]}"; do
            if [ "$(basename "$changeset")" = README.md ]; then
              continue
            fi
            found=true
            if [[ "$(basename "$changeset")" != renovate-*.md ]]; then
              dependency_only=false
            fi
          done
          if [ "$found" = true ] && [ "$dependency_only" = true ]; then
            echo "auto_merge=true" >> "$GITHUB_OUTPUT"
          else
            echo "auto_merge=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          commitMode: github-api
          publish: npm run release

      - name: Automerge dependency release after CI
        if: >-
          steps.dependency-release.outputs.auto_merge == 'true' &&
          steps.changesets.outputs.hasChangesets == 'true' &&
          steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_PR: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: gh pr merge --auto --squash "$RELEASE_PR"
